    InstanceCreation400:
      type: object
      description: |-
        Instance creation 400 error response - field validation errors.
        Each key is a field name, each value is a list of error messages.
      properties:
        mem_gib:
          type: array
          items:
            type: string
        n_vcpus:
          type: array
          items:
            type: string
        disk_size_gib:
          type: array
          items:
            type: string
        flavor:
          type: array
          items:
            type: string
        distro:
          type: array
          items:
            type: string
        resource_type:
          type: array
          items:
            type: string
    InstanceCreation422:
      type: object
      description: |-
        Instance creation 422 error response — insufficient resources. Host-capacity
        breaches carry nearest_available; account-cap breaches (bottleneck account_*)
        carry limit + current instead.
      properties:
        message:
          type: string
        requested:
          $ref: '#/components/schemas/ResourceRequest'
        nearest_available:
          $ref: '#/components/schemas/ResourceAvailability'
        bottleneck:
          type: array
          items:
            type: string
        limit:
          $ref: '#/components/schemas/ResourceRequest'
        current:
          $ref: '#/components/schemas/ResourceRequest'
      required:
      - bottleneck
      - message
      - requested
    InstancePortUpdate:
      type: object
      description: Validates a port number for updating on an instance's firewall.
      properties:
        message:
          type: string
        uuid:
          type: string
        wan_ports:
          type: array
          items:
            type: integer
            maximum: 65535
            minimum: 1
      required:
      - message
      - uuid
      - wan_ports
    PatchedInstanceUpdateRequest:
      type: object
      description: |-
        Swagger request body for PATCH /api/instance/{uuid}/ ONLY — the view
        handles 'project' itself (SetInstanceProjectSerializer) before the real
        InstancePartialUpdateSerializer runs, so this must never be used to save.
      properties:
        name:
          type: string
          description: User-friendly name for the VM/Container (must be unique)
          maxLength: 255
        n_vcpus:
          type: integer
          maximum: 256
          minimum: 1
          description: New vCPU count. Containers resize live; VMs reboot to apply
            (~60-90s of downtime, instance enters a 'resizing' state). Can be increased
            or decreased.
        mem_gib:
          type: integer
          maximum: 768
          minimum: 1
          description: New RAM in GiB. Containers resize live; VMs reboot to apply
            (~60-90s of downtime, instance enters a 'resizing' state). Can be increased
            or decreased.
        disk_size_gib:
          type: integer
          maximum: 2000
          minimum: 10
          description: New disk size in GiB. Containers can grow or shrink (live XFS
            quota on sovereign hosts; DB-only soft limit elsewhere). VMs can only
            grow -- a request to shrink a VM's disk is rejected -- and reboot to apply
            (~60-90s of downtime, 'resizing' state).
        auto_stop_enabled:
          type: boolean
        auto_stop_minutes:
          type: integer
          maximum: 1440
          minimum: 1
        project:
          type: string
          nullable: true
          description: Billing project to attribute this instance to (project name),
            or null to clear. Must be an active project of your org.
    PatchedProject:
      type: object
      description: |-
        Billing-attribution project. `name` is kebab-case-validated by the model's
        RegexValidator (ModelSerializer carries it over). `vm_count` is annotated by
        the view (Count("vms")); defaults to 0 on a freshly created project.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          pattern: ^[a-z]+(-[a-z]+)*$
          maxLength: 63
        archived:
          type: boolean
          readOnly: true
        vm_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
    PipelineLaunch:
      type: object
      description: 'Validates POST /api/pipeline-launch/: what to run, and where to
        put the output.'
      properties:
        pipeline:
          type: string
          description: nf-core name, git URL (pipeline_type='ref'), or raw main.nf
            source (pipeline_type='script').
        pipeline_type:
          enum:
          - ref
          - script
          type: string
          description: |-
            * `ref` - ref
            * `script` - script
          x-spec-enum-id: 7b83a4569472e9c6
          default: ref
        config:
          type: string
          default: ''
          description: nextflow.config text, layered on top of the head's own executor
            config via -c.
        engine_flags:
          type: array
          items:
            type: string
          description: Nextflow engine flags, e.g. ['-resume', '-profile', 'test'].
        pipeline_params:
          type: array
          items:
            type: string
          description: Pipeline parameters, e.g. ['--input', 'samplesheet.csv']. --outdir
            is added automatically.
        staged_files:
          type: array
          items:
            $ref: '#/components/schemas/StagedFile'
          description: Small local files referenced by name in engine_flags/pipeline_params
            (e.g. a samplesheet whose columns point at s3://... URLs) — contents are
            staged onto the head's run directory before dispatch and the reference
            is rewritten to the staged path. Combined content capped at 5 MiB.
        outdir:
          type: string
          description: s3:// URI for pipeline output — a bucket you own, or pair with
            external_aws_creds.
        cloned_from:
          type: string
          format: uuid
          nullable: true
          description: Run this launch was cloned from in the console — links the
            two in the runs list.
        external_aws_creds:
          allOf:
          - $ref: '#/components/schemas/ExternalAwsCreds'
          nullable: true
          description: Omit to use a Carolina Cloud bucket you own; provide to write
            to an external S3-compatible bucket.
      required:
      - outdir
      - pipeline
    PipelineLaunchResponse:
      type: object
      description: Response for POST /api/pipeline-launch/ — poll GET /api/pipeline-run/{id}/
        next.
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        head_uuid:
          type: string
      required:
      - head_uuid
      - id
      - state
    PipelineRunSummary:
      type: object
      description: One row of GET /api/pipeline-run/ — newest-first list of the caller's
        runs.
      properties:
        id:
          type: string
          format: uuid
        head_url:
          type: string
          nullable: true
          description: Live URL of the head's web terminal, if it still exists.
        status:
          enum:
          - active
          - closed
          - aborted
          type: string
          description: |-
            * `active` - active
            * `closed` - closed
            * `aborted` - aborted
          x-spec-enum-id: b0755bfa1f69cb57
        outcome:
          enum:
          - succeeded
          - failed
          - null
          type: string
          x-spec-enum-id: c784105c2922494d
          nullable: true
          description: |-
            Null while active or if the run never reported a verdict.

            * `succeeded` - succeeded
            * `failed` - failed
        nf_run_name:
          type: string
          nullable: true
        nf_session_uuid:
          type: string
          nullable: true
          description: Shared across -resume attempts of the same session.
        cloned_from:
          type: string
          format: uuid
          nullable: true
          description: Parent run id when this run was cloned in the console.
        created_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        duration_ms:
          type: integer
          nullable: true
          description: Nextflow's own workflow duration; null until completion.
      required:
      - closed_at
      - created_at
      - duration_ms
      - head_url
      - id
      - nf_run_name
      - nf_session_uuid
      - outcome
      - status
    Project:
      type: object
      description: |-
        Billing-attribution project. `name` is kebab-case-validated by the model's
        RegexValidator (ModelSerializer carries it over). `vm_count` is annotated by
        the view (Count("vms")); defaults to 0 on a freshly created project.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          pattern: ^[a-z]+(-[a-z]+)*$
          maxLength: 63
        archived:
          type: boolean
          readOnly: true
        vm_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - archived
      - created_at
      - id
      - name
      - vm_count
    ResourceAvailability:
      type: object
      description: Resource availability details (ram/disk in GiB)
      properties:
        cpus:
          type: integer
        ram:
          type: number
          format: double
        disk:
          type: integer
        gpu_model:
          type: string
        gpus:
          type: integer
      required:
      - cpus
      - disk
      - ram
    ResourceRequest:
      type: object
      description: Resource request details (ram/disk in GiB)
      properties:
        cpus:
          type: integer
        ram:
          type: integer
        disk:
          type: integer
        gpu_model:
          type: string
      required:
      - cpus
      - disk
      - ram
    StagedFile:
      type: object
      description: |-
        One local file to stage onto the head before dispatch — same mechanism as `config`,
        generalized. `name` must match a value verbatim in engine_flags/pipeline_params so the
        dispatcher knows which reference to rewrite to the staged path.
      properties:
        name:
          type: string
          maxLength: 255
        content:
          type: string
      required:
      - content
      - name
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Enter your API key (it will be automatically prefixed with 'Bearer
        ')
tags:
- name: Storage
- name: Compute Instances
- name: Nextflow Pipelines
- name: Project Management
- name: Account & Limits
