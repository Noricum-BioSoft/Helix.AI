        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Nextflow Pipelines
      responses:
        '200':
          description: Lightweight run summary — no DAG graph
      security:
      - BearerAuth: []
  /api/pipeline-run/{id}/debug-log/:
    get:
      operationId: pipeline_run_debug_log_retrieve
      description: |-
        Markdown bug report for a run, for one-click paste into an LLM. Owner-only. Builds
        on demand (stats a few S3 control files) — the frontend fetches it only on button click.
      summary: Get a debug report for a failed run
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Nextflow Pipelines
      responses:
        '200':
          description: Markdown bug report, paste-ready for an LLM
      security:
      - BearerAuth: []
  /api/pipeline-run/{id}/tasks/:
    get:
      operationId: pipeline_run_tasks_retrieve
      description: |-
        Tasks for a run, optionally filtered to one process via `?process=<FQ name>` —
        feeds the DAG viewer's per-process task table. Owner-only. `container_uuid` is the
        pool-worker the task ran on, for the detail drilldown's live /quickstats.
      summary: List a run's tasks
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: process
        schema:
          type: string
        description: Filter to one process's tasks by its fully-qualified name
      tags:
      - Nextflow Pipelines
