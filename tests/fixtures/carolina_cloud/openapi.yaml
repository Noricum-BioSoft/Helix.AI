        project:
          type: string
          readOnly: true
        host:
          type: string
          readOnly: true
      required:
      - created_at
      - currently_running_sentieon
      - disk_size_gib
      - host
      - hourly_cost_usd
      - mem_gib
      - n_vcpus
      - name
      - original_ccloud_password
      - owner_email
      - project
      - ram_cost_hourly_usd
      - sentieon_hourly_cost_usd
      - ssh_command
      - storage_cost_hourly_usd
      - uuid
      - vcpu_cost_hourly_usd
      - webapp_url
    InstanceActionResponse:
