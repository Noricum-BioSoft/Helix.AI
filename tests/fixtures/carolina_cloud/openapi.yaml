          type: number
          format: double
        storage_cost_hourly_usd:
          type: number
          format: double
        gpu_cost_hourly_usd:
          type: number
          format: double
        hourly_cost_usd:
          type: number
          format: double
          readOnly: true
        currently_running_sentieon:
          type: boolean
          readOnly: true
        sentieon_hourly_cost_usd:
          type: number
          format: double
          readOnly: true
        gpu_model:
          enum:
