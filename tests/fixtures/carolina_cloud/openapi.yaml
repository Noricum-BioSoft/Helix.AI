          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceActionResponse'
          description: Instance stopped successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: Bad request - Invalid state
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailErrorResponse'
          description: Unauthenticated - Invalid or missing API key
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Instance not found
      security:
      - BearerAuth: []
  /api/limits/:
    get:
      operationId: limits_retrieve
      description: Shortcut for the `limits` key of `/api/whoami/`.
      summary: Get your account limits, usage, and rate limits
      tags:
      - Account & Limits
      responses:
        '200':
          description: No response body
      security:
      - BearerAuth: []
  /api/org/:
    get:
      operationId: org_retrieve
      description: 'Not in an org: `{"in_org": false}`. Members get the org summary.
        Org admins additionally get `members`: each member''s role flags, spend allocation
        (cap + consumed, null cap = uncapped), instance counts and per-instance breakdown,
        storage, and total hourly cost.'
      summary: Get your organization
      tags:
      - Account & Limits
      responses:
        '200':
          description: No response body
      security:
      - BearerAuth: []
    patch:
      operationId: org_partial_update
      description: 'Body: `{"name": "<new name>"}`. Only the display name changes
        — billing and audit history key on the org id.'
      summary: Rename your organization (org admins only)
      tags:
      - Account & Limits
      responses:
        '200':
          description: No response body
      security:
      - BearerAuth: []
  /api/pipeline-launch/:
    post:
      operationId: pipeline_launch_create
      description: |-
        Preflights the pipeline reference and outdir bucket, provisions an ephemeral Nextflow head, and dispatches `nextflow run` into it — no manual SSH or head provisioning required. Returns immediately; poll `GET /api/pipeline-run/{id}/` for status, and the other pipeline-run endpoints for tasks/logs/output. The head is torn down automatically once the run closes.

        **Key fields**

        - `pipeline` — what to run: an nf-core name (`nf-core/rnaseq`) or git URL with `pipeline_type: "ref"`, or the raw text of a `main.nf` script with `pipeline_type: "script"`.
        - `engine_flags` — single-dash options consumed by the Nextflow engine itself, as a flat list of strings: `["-resume", "-profile", "test", "-r", "3.14.0"]`. `-c`/`-config` and `-plugins` are managed by the platform and rejected here.
        - `pipeline_params` — double-dash parameters consumed by the pipeline (what nf-core docs call params), same flat-list format: `["--input", "s3://my-bucket/samplesheet.csv", "--genome", "GRCh38"]`.
        - `outdir` — s3:// URI where the pipeline writes results. It's validated up front (the bucket must exist and be yours, or be writable via `external_aws_creds`) and then passed to the pipeline as `--outdir` automatically — don't repeat it in `pipeline_params`.
        - `config` — the *contents* of a `nextflow.config` as a string, not a filename. Equivalent to `nextflow run -c nextflow.config`: it's staged onto the head and layered on top of the head's built-in executor config. Use it for process resources, `withName:` overrides, params defaults, etc.
      summary: Launch a Nextflow pipeline
      tags:
      - Nextflow Pipelines
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineLaunch'
            examples:
              RunAnNf-corePipeline:
                value:
                  pipeline: nf-core/demo
                  pipeline_type: ref
                  outdir: s3://my-bucket/pipeline-runs/demo-1/out
                  engine_flags:
                  - -profile
                  - test
                  pipeline_params: []
                summary: Run an nf-core pipeline
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PipelineLaunch'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PipelineLaunch'
        required: true
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineLaunchResponse'
          description: Launch accepted — head and run are starting in the background
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Invalid request body, or the pipeline/outdir preflight failed
        '402':
          description: No card or credits on file
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: outdir bucket not found or not owned by you
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Head provisioning failed
      security:
      - BearerAuth: []
  /api/pipeline-run/:
    get:
      operationId: pipeline_run_list
      description: Newest-first, capped at 200. POST (open a run) is plugin-internal
        and hidden from this schema — see POST /api/pipeline-launch/ instead.
      summary: List your pipeline runs
      tags:
      - Nextflow Pipelines
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipelineRunSummary'
          description: The caller's pipeline runs
      security:
      - BearerAuth: []
  /api/pipeline-run/{id}/:
    get:
      operationId: pipeline_run_detail
      description: Fetch a PipelineRun's current state (GET) or close it (DELETE).
        Owner-only.
      summary: Get pipeline run status
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Nextflow Pipelines
      responses:
        '200':
          description: The run's current status/outcome
      security:
      - BearerAuth: []
    delete:
      operationId: pipeline_run_close
      description: Tears down surviving pool workers (and the head, if it was launched
        via /api/pipeline-launch/). Idempotent — safe to call on an already-closed
        run.
      summary: Close/cancel a pipeline run
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Nextflow Pipelines
      responses:
        '200':
          description: The run's final state
      security:
      - BearerAuth: []
  /api/pipeline-run/{id}/console/:
    get:
      operationId: pipeline_run_console_retrieve
      description: |-
        Run-level detail for the console runs-browser drilldown. Owner-only. Lighter than
