          - rtx-5090
          - pro-6000-blackwell
          - ''
          - null
          type: string
          description: |-
            * `rtx-4090` - NVIDIA GeForce RTX 4090
            * `rtx-5090` - NVIDIA GeForce RTX 5090
            * `pro-6000-blackwell` - NVIDIA RTX PRO 6000 Blackwell
          x-spec-enum-id: aa84de56b5eb69d1
          nullable: true
        cpu_tier:
          enum:
          - general-purpose
          - high-performance
          type: string
          x-spec-enum-id: 6dc34ff4ff009ea2
          description: |-
            CPU performance tier for this instance

            * `general-purpose` - General Purpose
            * `high-performance` - High Performance
        ssh_command:
          type: string
          readOnly: true
        webapp_url:
          type: string
          readOnly: true
        wan_ports: {}
        auto_stop_enabled:
          type: boolean
