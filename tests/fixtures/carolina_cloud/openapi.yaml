components:
  schemas:
    CloneInstance:
      type: object
      description: |-
        Validates a clone request for a VM or container. Capacity is checked in the view
        when it resolves the target host. NOTE: a clone is a NEW instance — the view reserves
        the FULL vCPU/RAM/disk on the target (a brand-new disk). This is the OPPOSITE of a
        restart, which reserves disk=0 because the disk was never freed.
      properties:
        name:
          type: string
          description: Name for the clone (kebab-case). Omitted, we auto-name it '<source>-clone-<id>'.
        move_public_ip:
          type: boolean
          default: false
          description: 'Move the source''s dedicated public IP to the clone. Default:
            leave it on the source.'
        include_overlay:
          type: boolean
          default: false
          description: 'Containers only. Default false: the clone runs the same flavor
            image + your copied home/data volumes (fast). True: also copy the container''s
            filesystem overlay (custom changes outside your volumes) — slower, copies
            the full image.'
        target_host:
          type: string
          description: 'Ops-only: pin the target host by hostname. Ignored for non-superusers
            (host is auto-selected).'
    DetailErrorResponse:
      type: object
      description: DRF standard error response (used for auth failures)
      properties:
        detail:
          type: string
      required:
      - detail
    ErrorResponse:
      type: object
      description: Generic error response
      properties:
        error:
          type: string
      required:
      - error
    ExternalAwsCreds:
      type: object
      description: BYO S3-compatible credentials for a pipeline-launch outdir we don't
        manage.
      properties:
        endpoint_url:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
      required:
      - access_key_id
      - endpoint_url
      - secret_access_key
    Instance:
      type: object
      description: |-
        Unified serializer for all instance operations (list, detail, create response).
        Includes all fields including costs, password, and computed properties.
      properties:
        uuid:
          type: string
          maxLength: 80
        name:
          type: string
          description: User-friendly name for the VM/Container (must be unique)
          maxLength: 255
        lan_ipv4:
          type: string
          maxLength: 255
        state:
          enum:
          - running
          - shut_off
          - exited
          - lost
          - provisioning
          - error
          - unhealthy
          - migrating
          - cloning
          - resizing
          - deleting
          - deleted
          - idle
          type: string
          description: |-
            * `running` - Running
            * `shut_off` - Shut Off
            * `exited` - Exited
            * `lost` - Lost
            * `provisioning` - Provisioning
            * `error` - Error
            * `unhealthy` - Unhealthy
            * `migrating` - Migrating
            * `cloning` - Cloning
            * `resizing` - Resizing
            * `deleting` - Deleting
            * `deleted` - Deleted
            * `idle` - Idle
          x-spec-enum-id: 459eac7551aeaa0c
        n_vcpus:
          type: integer
          maximum: 100
          minimum: 1
        disk_size_gib:
          type: integer
          maximum: 500
          minimum: 1
        n_gpus:
          type: integer
          maximum: 100
          minimum: 0
        mem_gib:
          type: number
          format: double
          maximum: 512
          minimum: 0.5
        wan_ssh_port:
          type: integer
          maximum: 65535
          minimum: 1
          nullable: true
          description: SSH port number on login.carolinacloud.io for accessing this
            instance
        resource_type:
          enum:
          - vm
          - container
          type: string
          x-spec-enum-id: 5f1c2f2b2b2cbc3f
          description: |-
            Whether this is a VM or Container

            * `vm` - Virtual Machine
            * `container` - Container
        owner_email:
          type: string
          format: email
          readOnly: true
        flavor:
          enum:
          - base
          - vm
          - marimo
          - rstudioserver
          - rgeospatial
          - datascience
          - datasciencemarimo
          - genomics
          - jupyterlab
          - nextflow-head
          - sandboxbio
          - chromium
          type: string
          x-spec-enum-id: ef9ba4ea14d9c963
          description: |-
            The flavor of the VM/Container (e.g. marimo, rserver, genomics or null for generic)

            * `base` - Base
            * `vm` - Virtual Machine
            * `marimo` - Marimo
            * `rstudioserver` - RStudio Server
            * `rgeospatial` - RStudio Server (geospatial)
            * `datascience` - Data Science
            * `datasciencemarimo` - Data Science Notebook
            * `genomics` - Genomics
            * `jupyterlab` - JupyterLab
            * `nextflow-head` - Nextflow Head
            * `sandboxbio` - Sandbox.bio Nextflow Tutorial
            * `chromium` - Chromium
        distro:
